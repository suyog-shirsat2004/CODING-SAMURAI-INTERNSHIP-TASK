<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    (function() {
      var base = '/CODING-SAMURAI-INTERNSHIP-TASK';
      var path = window.location.pathname;
      var apps = ['counter-app', 'weather-app', 'todo-list', 'e-commerce', 'chat-app'];
      for (var i = 0; i < apps.length; i++) {
        if (path.startsWith(base + '/' + apps[i])) {
          sessionStorage.setItem('redirect', path);
          window.location.replace(base + '/' + apps[i] + '/');
          return;
        }
      }
      document.title = 'Page Not Found';
      document.body.innerHTML = '<h1>404 - Page Not Found</h1><p>The page you requested does not exist.</p><a href="' + base + '/">Go to Home</a>';
    })();
  </script>
</head>
<body></body>
</html>
