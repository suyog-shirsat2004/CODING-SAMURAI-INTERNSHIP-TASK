name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
    paths:
      - 'Task-1-Portfolio-Website/**'
      - 'Task-2-Counter-App/**'
      - 'Task-3-Weather-App/**'
      - 'Task-4-Todo-List/**'
      - 'Task-5-E-Commerce-Website/**'
      - 'Task-6-Chat-Application/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Task-1-Portfolio-Website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./Task-1-Portfolio-Website/package-lock.json
      - name: Install & Build Portfolio
        working-directory: ./Task-1-Portfolio-Website
        run: |
          npm ci
          npm run build
      - name: Install & Build Counter App
        working-directory: ./Task-2-Counter-App
        run: |
          npm ci
          NODE_ENV=production npm run build
      - name: Install & Build Weather App
        working-directory: ./Task-3-Weather-App
        run: |
          npm ci
          NODE_ENV=production npm run build
      - name: Install & Build Todo List
        working-directory: ./Task-4-Todo-List
        run: |
          npm ci
          NODE_ENV=production npm run build
      - name: Install & Build E-Commerce Website
        working-directory: ./Task-5-E-Commerce-Website
        run: |
          npm ci
          NODE_ENV=production npm run build
      - name: Install & Build Chat Application
        working-directory: ./Task-6-Chat-Application
        run: |
          npm ci
          NODE_ENV=production npm run build
      - name: Combine builds
        run: |
          mkdir -p dist/counter-app
          mkdir -p dist/weather-app
          mkdir -p dist/todo-list
          mkdir -p dist/e-commerce
          mkdir -p dist/chat-app
          cp -r ../Task-2-Counter-App/dist/* dist/counter-app/
          cp -r ../Task-3-Weather-App/dist/* dist/weather-app/
          cp -r ../Task-4-Todo-List/dist/* dist/todo-list/
          cp -r ../Task-5-E-Commerce-Website/dist/* dist/e-commerce/
          cp -r ../Task-6-Chat-Application/dist/* dist/chat-app/
          cp dist/counter-app/index.html dist/counter-app/404.html
          cp dist/weather-app/index.html dist/weather-app/404.html
          cp dist/todo-list/index.html dist/todo-list/404.html
          cp dist/e-commerce/index.html dist/e-commerce/404.html
          cp dist/chat-app/index.html dist/chat-app/404.html
          cat > dist/404.html << 'EOF'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting...</title>
            <script>
              (function() {
                var base = '/CODING-SAMURAI-INTERNSHIP-TASK';
                var path = window.location.pathname;
                var apps = ['counter-app', 'weather-app', 'todo-list', 'e-commerce', 'chat-app'];
                for (var i = 0; i < apps.length; i++) {
                  if (path.startsWith(base + '/' + apps[i])) {
                    sessionStorage.setItem('redirect', path);
                    window.location.replace(base + '/' + apps[i] + '/');
                    return;
                  }
                }
                document.title = 'Page Not Found';
                document.body.innerHTML = '<h1>404 - Page Not Found</h1><p>The page you requested does not exist.</p><a href="' + base + '/">Go to Home</a>';
              })();
            </script>
          </head>
          <body></body>
          </html>
          EOF
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './Task-1-Portfolio-Website/dist'
      - id: deployment
        uses: actions/deploy-pages@v4
